services:
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881/udp"
    environment:
      - REDIS_HOST=livekit-redis
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secretkey}
    command: >
      --bind 0.0.0.0
      --port 7880
      --udp-port 7881
      --redis-host livekit-redis:6379
      --dev
    depends_on:
      - livekit-redis

  livekit-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
